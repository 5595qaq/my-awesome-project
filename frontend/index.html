<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VLM+LLM Nursing Exam Evaluation</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Nursing Practical Exam Auto-Scorer (VLM)</h1>

        <form id="evaluation-form">
            <div class="form-group">
                <label>Examination Topic</label>
                <select id="exam-topic">
                    <option value="iv-injection">Intravenous (IV) Injection</option>
                    <option value="wound-care">Sterile Wound Care</option>
                    <option value="cpr">CPR & Basic Life Support</option>
                </select>
            </div>

            <div class="form-group">
                <label for="video-files">Upload Videos to GCS</label>
                <input type="file" id="video-files" multiple accept="video/*">
                <button type="button" id="upload-btn">Upload to GCS</button>
                <ul id="upload-status-list" class="log-box upload-status-list"></ul>
            </div>

            <div class="form-group">
                <label for="video-paths">Or paste existing gs:// paths (comma separated or multi-line, optional)</label>
                <textarea id="video-paths" rows="3" placeholder="gs://vlm_on99/1/cam1.mp4&#10;gs://vlm_on99/1/cam2.mp4"></textarea>
            </div>

            <button type="submit" id="submit-btn">Start Evaluation</button>
        </form>

        <div id="progress-container" class="hidden">
            <h2>Job Status: <span id="job-status">Preparing...</span></h2>
            <div class="progress-bar">
                <div class="progress-fill" id="progress-fill"></div>
            </div>
            <ul id="log-list" class="log-box"></ul>
        </div>

        <div id="result-container" class="hidden">
            <h2>Evaluation Results</h2>
            <div id="result-feed"></div>

            <details class="raw-json-block">
                <summary>View Raw JSON Response</summary>
                <pre id="raw-json"></pre>
            </details>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
